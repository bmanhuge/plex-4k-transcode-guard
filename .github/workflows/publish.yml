name: Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, push and verify the Docker Mod
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test -count=1 -timeout 10m ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
          labels: |
            org.opencontainers.image.title=plex-4k-transcode-guard
            org.opencontainers.image.description=LinuxServer.io Plex Docker Mod that terminates video sessions transcoding a 4K/UHD source with a configurable message
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=bmanhuge

      - name: Resolve version string
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}

      - name: Verify anonymous pull and single-layer manifests
        env:
          REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="sha-${GITHUB_SHA::7}"
          REF="${IMAGE}:${SHORT}"
          docker logout ghcr.io
          if ! docker manifest inspect "${REF}" >/tmp/manifest.json 2>/tmp/manifest.err; then
            cat /tmp/manifest.err
            echo "::error::${REF} cannot be pulled anonymously. The GHCR package must be PUBLIC for LinuxServer DOCKER_MODS to fetch it: https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages -> package settings -> Change visibility."
            exit 1
          fi
          jq . /tmp/manifest.json
          for arch in amd64 arm64; do
            jq -e --arg a "${arch}" '.manifests[] | select(.platform.architecture == $a)' /tmp/manifest.json >/dev/null \
              || { echo "::error::no ${arch} manifest"; exit 1; }
            docker pull --platform "linux/${arch}" "${REF}" >/dev/null
            layers="$(docker image inspect "${REF}" --format '{{len .RootFS.Layers}}')"
            test "${layers}" = "1" || { echo "::error::${arch} image has ${layers} layers, the docker-mods loader needs exactly 1"; exit 1; }
            docker image rm "${REF}" >/dev/null
          done
          echo "anonymous pull OK, single layer on both platforms"

      - name: End-to-end inside lscr.io/linuxserver/plex using the published tag
        run: MOD_SOURCE="registry:${IMAGE}:sha-${GITHUB_SHA::7}" ./scripts/e2e-sideload.sh

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Published plex-4k-transcode-guard"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- DOCKER_MODS reference: \`${IMAGE}:latest\` (or pin \`${IMAGE}:sha-${GITHUB_SHA::7}\`)"
            echo "- Anonymous pull, single-layer manifests (amd64, arm64) and the in-container end-to-end test passed."
          } >> "$GITHUB_STEP_SUMMARY"
